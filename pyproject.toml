[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itl-accelerator-provider"
version = "0.1.0"
description = "ITL Control Plane Resource Provider for GPU, TPU, and other accelerators"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ITLusions", email = "dev@itlusions.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "itl-controlplane-sdk[fastapi,persistence-sqlalchemy]>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-httpx>=0.25.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
redis = [
    "redis>=5.0.0",
]
monitoring = [
    "prometheus-client>=0.19.0",
]

[project.urls]
Repository = "https://github.com/itlusions/ITL.ControlPlane.ResourceProvider.Accelerator"
Documentation = "https://docs.itlusions.com/control-plane/accelerator"
Issues = "https://github.com/itlusions/ITL.ControlPlane.ResourceProvider.Accelerator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]
extend-ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "integration: integration tests",
    "unit: unit tests",
    "slow: slow tests",
]
